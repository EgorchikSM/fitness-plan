<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>Тренировки</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#0f1115;--bg2:#14171d;--panel:#171a21;--panel2:#1e222b;--border:#2a2f3a;
  --text:#eef1f6;--text2:#a8b0bf;--text3:#6b7484;
  --blue:#4f8cff;--blue2:#9cc0ff;--green:#3ecf8e;--red:#ff6b6b;--yellow:#ffc94d;
  --r:14px;--nav-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 74px)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
h1{font-size:22px;font-weight:700}h2{font-size:19px;font-weight:700}h3{font-size:16px;font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.tophead{padding:calc(14px + env(safe-area-inset-top)) 16px 6px;position:sticky;top:0;background:linear-gradient(var(--bg) 85%,transparent);z-index:15}
.tophead p{color:var(--text2);font-size:13px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin-bottom:8px}
.card p{color:var(--text2);font-size:14px;margin:4px 0}
.meta{font-size:12px;color:var(--text3)}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);font-size:15px;font-weight:600}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#06281a}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.chip{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;background:var(--panel2);color:var(--text2)}
.chip.blue{background:rgba(79,140,255,.18);color:var(--blue2)}
.chip.green{background:rgba(62,207,142,.15);color:var(--green)}
.chip.gray{background:transparent;border:1px dashed var(--border);color:var(--text3)}
.chip.red{background:rgba(255,107,107,.15);color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600;text-align:right}
/* nav */
nav#bottomNav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(23,26,33,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:40}
nav#bottomNav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text3);font-size:10px;font-weight:600}
nav#bottomNav button.active{color:var(--blue)}
nav#bottomNav svg{width:22px;height:22px}
/* timer bar */
#timerBar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--border);z-index:39;padding:10px 16px}
.tb-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tb-time{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:78px}
.tb-time.hot{color:var(--red)}
.tb-presets{display:flex;gap:5px;flex-wrap:wrap}
.tb-presets button{padding:6px 10px;border-radius:9px;border:1px solid var(--border);font-size:12px;color:var(--text2)}
.tb-presets button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.tb-ctrl{margin-left:auto;display:flex;gap:8px}
.tb-ctrl button{padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px}
#tStart{background:var(--blue);color:#fff}
#tReset{background:var(--panel2);border:1px solid var(--border)}
/* sheets/modals */
#sheetMask,#modalMask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;z-index:61;transform:translateY(105%);transition:transform .25s ease;max-height:80vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
#sheet.open{transform:translateY(0)}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);width:min(92vw,440px);max-height:80vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;z-index:61;padding:20px;display:none}
#modal.open{display:block;transform:translate(-50%,-50%) scale(1)}
.sheet-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600;width:100%;text-align:left}
.sheet-item:last-child{border:none}
.sheet-item svg{width:20px;height:20px;color:var(--text3)}
/* workout */
.ex{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
.ex-head{display:flex;align-items:center;gap:8px;padding:13px 14px}
.ex-head .nm{font-weight:600;font-size:15px;flex:1}
.ex-head .sch{font-size:12px;color:var(--text2);white-space:nowrap}
.ex.done{border-color:var(--green)}
.ex.done .nm{color:var(--green)}
.ex.skipped{opacity:.55}
.ex-body{padding:0 14px 14px;border-top:1px solid var(--border)}
.tip{background:rgba(255,201,77,.08);border-left:3px solid var(--yellow);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--text2);margin:10px 0 6px}
.err{background:rgba(255,107,107,.08);border-left:3px solid var(--red);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--text2);margin:6px 0}
.prev{background:rgba(79,140,255,.08);border-left:3px solid var(--blue);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--text2);margin:6px 0}
.srow{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
.srow .sn{font-size:13px;color:var(--text3);text-align:center}
.srow input{padding:9px 10px;font-size:15px;font-variant-numeric:tabular-nums}
.ck{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--border);background:var(--panel2);font-size:16px;color:transparent;transition:.15s}
.ck.on{background:var(--green);border-color:var(--green);color:#06281a;font-weight:700}
.vid{display:block;padding:9px 12px;margin-top:6px;border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--blue2);text-decoration:none}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);font-size:15px;color:var(--text2);flex-shrink:0}
.iconbtn.red{color:var(--red)}
/* progress bars */
.pline{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.pline>div{height:100%;border-radius:999px;background:var(--blue);transition:width .3s}
.pline.g>div{background:var(--green)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .hd{font-size:11px;color:var(--text3);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--panel2);font-size:13px;position:relative}
.cal button.today{border-color:var(--blue);color:var(--blue2);font-weight:700}
.cal button.has-green{background:rgba(62,207,142,.18);border-color:var(--green);color:var(--green)}
.cal button.has-blue{background:rgba(79,140,255,.18);border-color:var(--blue);color:var(--blue2)}
.cal button.has-red{background:rgba(255,107,107,.15);border-color:var(--red);color:var(--red)}
.cal button.fut{opacity:.35}
canvas.chart{width:100%;height:180px;background:var(--panel2);border-radius:12px}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--border);font-size:13px;color:var(--text2)}
.seg button.sel{background:var(--text);color:#111;font-weight:600;border-color:var(--text)}
.slider-row{margin:14px 0}
.slider-row .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.slider-row .val{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;padding:0;height:34px;background:transparent;border:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--panel2);border-radius:999px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--blue);margin-top:-10px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid .ph{aspect-ratio:3/4;border-radius:12px;border:1px dashed var(--border);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3);text-align:center;overflow:hidden;position:relative}
.photo-grid img{width:100%;height:100%;object-fit:cover}
.photo-grid .ph span{position:absolute;bottom:6px;left:0;right:0;background:rgba(0,0,0,.55);font-size:10px;padding:2px}
.water-btns{display:flex;gap:8px;margin-top:8px}
.water-btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);font-weight:600}
.fitem{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--text);color:#111;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border-radius:12px;padding:12px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--text3)}
@media(min-width:560px){.stat-grid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="tophead"><div class="wrap" style="padding:0 16px"><h1 id="pgTitle">Главная</h1><p id="pgSub"></p></div></div>
<main id="view" class="wrap"></main>

<nav id="bottomNav">
  <button data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Главная</button>
  <button data-r="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Тренировка</button>
  <button data-r="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>История</button>
  <button data-r="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M6 16v-5M11 16V7M16 16v-8M21 16V4"/></svg>Прогресс</button>
  <button data-r="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Ещё</button>
</nav>

<div id="timerBar"><div class="tb-in">
  <div class="tb-time" id="tDisp">1:30</div>
  <div class="tb-presets" id="tPresets">
    <button data-s="60">1:00</button><button data-s="90" class="sel">1:30</button><button data-s="120">2:00</button><button data-s="180">3:00</button>
  </div>
  <div class="tb-ctrl"><button id="tStart">Старт</button><button id="tReset">Сброс</button></div>
</div></div>

<div id="sheetMask"></div>
<div id="sheet"></div>
<div id="modalMask"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= IndexedDB ================= */
const DB=(()=>{let db;
  function open(){return new Promise((res,rej)=>{const q=indexedDB.open('fitness-app',1);
    q.onupgradeneeded=e=>{const d=e.target.result;
      d.createObjectStore('kv');d.createObjectStore('photos');};
    q.onsuccess=e=>{db=e.target.result;res()};q.onerror=()=>rej(q.error);});}
  function tx(s,m){return db.transaction(s,m).objectStore(s);}
  const get=(s,k)=>new Promise((res,rej)=>{const q=tx(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
  const set=(s,k,v)=>new Promise((res,rej)=>{const q=tx(s,'readwrite').put(v,k);q.onsuccess=res;q.onerror=()=>rej(q.error)});
  const del=(s,k)=>new Promise((res,rej)=>{const q=tx(s,'readwrite').delete(k);q.onsuccess=res;q.onerror=()=>rej(q.error)});
  const all=s=>new Promise((res,rej)=>{const q=tx(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});
  return{open,get,set,del,all};
})();
/* ================= State ================= */
const DEF={
 settings:{name:'',height:176,weight:72,targetWeight:75,calTarget:2600,pTarget:150,fTarget:80,cTarget:300,waterTarget:2500,restSec:90,autoTimer:true,weekStart:'2026-11-16'},
 templates:{},sessions:{},body:{},food:{},water:{},wellness:{},customEx:{}
};
let ST=null, PHOTOS=[];
let saveT=null;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(()=>DB.set('kv','state',ST).catch(()=>toast('Ошибка сохранения')),300);}
async function loadState(){
  try{ST=await DB.get('kv','state');}catch(e){ST=null;}
  if(!ST){ // миграция из старой версии localStorage
    ST=JSON.parse(JSON.stringify(DEF));
    try{const old=JSON.parse(localStorage.getItem('fp1')||'{}');
      if(old&&old.done){const d=new Date().toISOString().slice(0,10);
        if(old.done[d]){let exs={};Object.keys(old.done[d]).forEach(k=>{const[,id]=k.split(':');exs[id]={sets:(old.done[d][k]||[]).map(v=>({w:'',reps:'',done:!!v}))};});
          ST.sessions[d]={type:'strength',done:true,exs};}}
    }catch(e){}
  }
  ST.settings=Object.assign({},DEF.settings,ST.settings||{});
  ['templates','sessions','body','food','water','wellness','customEx'].forEach(k=>{ST[k]=ST[k]||{}});
  PHOTOS=await DB.all('photos').catch(()=>[]);
}
/* ================= Default program ================= */
const TIPS={
 bench:{tip:"Глаза под грифом, лопатки сведены и прижаты к скамье. Опускай на середину груди, локти под 45–60° к корпусу. Касаешься грудью — сразу жми вверх.",err:"Ошибки: локти в 90°, отрыв ягодиц, отбив грифа от груди.",vid:[["https://rutube.ru/video/945b7be115b01369fcaebf04707505a5","Техника жима лёжа — Твой Тренер"]]},
 dbpress:{tip:"Спина плотно к спинке, жми по одной линии вверх. Наверху — микросгиб в локтях, не запирай в замок. Опускай до уровня плеч.",err:"Ошибки: прогиб поясницы, вес, который не можешь закинуть на плечи сам.",vid:[["https://www.youtube.com/watch?v=MT0Z1J6TPKE","Основы и ошибки — FitStars"],["https://www.youtube.com/watch?v=X5bgyaiWoJI","Наглядно — Ilya Generalov"]]},
 fly:{tip:"Локти слегка согнуты — угол фиксируется на весь подход. Опускай до уровня плеч, не глубже. Поднимай, будто обнимаешь большой мяч.",err:"Вес НЕ большой: 12–15 чистых повторов. Тяжёлая разводка травмирует плечи.",vid:[["https://rutube.ru/video/6c23f56f437169a8bb0cfcb009ccaace","Разведение гантелей лёжа — BodySportal"]]},
 french:{tip:"Хват на ширине плеч, локти смотрят вверх и НЕ разъезжаются. Опускай за голову до ~90° в локтях, наверху пауза 1 сек.",err:"Ошибки: разведённые локти, рывки, большой вес.",vid:[["https://www.youtube.com/watch?v=UhjZOt3w7Uo","Техника и советы — Есипович"],["https://www.youtube.com/watch?v=JdYXSkeGrQk","Техника выполнения"]]},
 pushn:{tip:"Руки под грудью, локти вдоль корпуса. Тело — прямая линия. Первые недели оставляй 2 повтора в запасе.",err:"Не прогибай поясницу и не задирай таз.",vid:[]},
 lat:{tip:"Слегка согнутые руки, поднимай строго в стороны до уровня плеч, без рывков корпусом.",err:"Если приходится раскачиваться — вес велик.",vid:[]},
 goblet:{tip:"Гантель вертикально к груди. Носки чуть врозь, приседай максимально глубоко. Колени смотрят туда же, куда носки, вес на пятках. Спина ровная.",err:"Ошибки: пятки отрываются, скруглённая спина, колени внутрь.",vid:[["https://rutube.ru/video/0fbf2d65dbece1d1afb3408d0ddb3634","Техника — Твой Тренер"],["https://www.youtube.com/watch?v=GtKTY86s0GM","Приседания гоблет — HiitWorks"]]},
 lunge:{tip:"Шаг максимально длинный, колено передней ноги НЕ за носок. Корпус слегка вперёд, поясница в естественном прогибе. Ноги слегка врозь — устойчивее.",err:"Главная ошибка новичков — колено за носок.",vid:[["https://www.youtube.com/watch?v=vNrkKOiksCs","Техника — Есипович"]]},
 rdl:{tip:"Колени слегка согнуты, таз назад, спина ровная. Опускай медленно до натяжения задней поверхности бедра. Подъём — ягодицы и задняя поверхность.",err:"Ошибки: округление спины, прямые ноги, быстрое опускание.",vid:[["https://www.youtube.com/watch?v=z2SeYAR0NVo","Romanian Deadlift — Generalov"],["https://www.youtube.com/watch?v=_mWBh-VSKQg","Румынская тяга"]]},
 bridge:{tip:"Лопатки на краю скамьи, гантель на тазобедренных суставах. Поднимай таз до полного выпрямления бёдер. Сожми ягодицы на 1 сек наверху.",err:"Не «роняй» таз внизу — опускай подконтрольно.",vid:[["https://www.youtube.com/watch?v=xlbSXrMB2uo","Техника + прогрессия"]]},
 calf:{tip:"Поднимайся максимально высоко, пауза 1 сек наверху. Внизу — глубокое растяжение икры.",err:"Не пружинь: медленный темп = рост икр.",vid:[]},
 plank:{tip:"Тело — прямая линия. Не прогибай поясницу и не задирай таз. Дыши ровно.",err:"Лучше 60 чистых секунд, чем 90 «прогнутых».",vid:[]},
 row:{tip:"Наклон с ровной спиной. Тянешь штангу к животу — локти строго назад и вверх. Наверху сведи лопатки на 1 сек.",err:"Ошибки: сутулость, рывки корпусом, работа руками вместо спины.",vid:[["https://www.youtube.com/watch?v=D3E6BEuROfM","Тяга в наклоне — Generalov"],["https://www.youtube.com/watch?v=njGz6T135lQ","Bent-Over Row — Есипович"]]},
 dbrow:{tip:"Колено и рука на скамье, спина параллельна полу. Движение начинается с лопатки. Локоть наверху — выше спины.",err:"Не крути корпус вверх.",vid:[["https://www.youtube.com/watch?v=Ch4UZW_j08Q","Тяга гантели — FitStars"],["https://www.youtube.com/watch?v=t9XqzZyQQbE","Alternating row"]]},
 pull:{tip:"Подтягивания: хват чуть шире плеч, грудь к перекладине. Нет перекладины → тяга штанги к поясу стоя 4×12.",err:"Не раскачивайся и не подбрасывай подбородок.",vid:[]},

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const todayISO=()=>iso(new Date());
const RU_D=['вс','пн','вт','ср','чт','пт','сб'];
const RU_DF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const RU_M=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function fmtDate(isoStr){const[y,m,d]=isoStr.split('-').map(Number);return d+' '+RU_M[m-1];}
function dowOf(isoStr){const[y,m,d]=isoStr.split('-').map(Number);return new Date(y,m-1,d).getDay();}
function weekDates(){const now=new Date();const mon=new Date(now);const diff=(mon.getDay()+6)%7;mon.setDate(mon.getDate()-diff);const a=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);a.push(iso(d));}return a;}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,1800);}
function openSheet(html){$('sheet').innerHTML=html;$('sheet').classList.add('open');$('sheetMask').style.display='block';}
function closeSheet(){$('sheet').classList.remove('open');$('sheetMask').style.display='none';}
function openModal(html){$('modal').innerHTML=html;$('modal').classList.add('open');$('modalMask').style.display='block';}
function closeModal(){$('modal').classList.remove('open');$('modalMask').style.display='none';}
$('sheetMask').onclick=closeSheet;$('modalMask').onclick=closeModal;
function getTemplate(dow){ // dow 0-6
  const t=ST.templates[String(dow)];
  if(t) return t;
  const def=DEFAULT_TEMPLATES[String(dow)];
  return def?{...def,exs:def.exs.map(e=>({id:e[0],name:e[1],scheme:e[2],sets:e[3]}))}:null;
}
function ensureTemplates(){[2,5,6].forEach(d=>{if(!ST.templates[String(d)]){const def=DEFAULT_TEMPLATES[String(d)];ST.templates[String(d)]={key:def.key,name:def.name,exs:def.exs.map(e=>({id:e[0],name:e[1],scheme:e[2],sets:e[3]}))};}});}
function exInfo(id){return TIPS[id]||ST.customEx[id]||{tip:'',err:'',vid:[]};}

function currentWeekNum(){const start=new Date(ST.settings.weekStart);const now=new Date();const wk=Math.floor((now-start)/(7*864e5));return Math.min(4,(wk%4)+1);}
function calcRecords(){
  const best={};const names={};
  Object.values(ST.sessions).filter(s=>s.done).forEach(s=>Object.entries(s.exs||{}).forEach(([id,e])=>{
    const nm=e.name||id;names[id]=nm;
    (e.sets||[]).forEach(st=>{if(st.done&&+st.w>0){const r=+st.reps||0;const vol=(+st.w)*r;
      if(!best[id]||vol>best[id].vol)best[id]={w:+st.w,reps:r,vol};}});
  }));
  return Object.entries(best).map(([id,b])=>({name:names[id]||id,val:b.w+' кг × '+b.reps})).slice(0,6);
}
function markVB(){ST.sessions[todayISO()]={type:'vb',done:true,exs:{}};scheduleSave();toast('Отмечено ✓');render();}

/* ================= TRAIN ================= */
function curSession(){
  const tKey=todayISO(),dow=new Date().getDay(),tpl=getTemplate(dow);
  if(!tpl)return null;
  let s=ST.sessions[tKey];
  if(!s||s.type!=='strength'){
    s={type:'strength',tplKey:String(dow),name:tpl.name,done:false,comment:'',exs:{}};
    tpl.exs.forEach(e=>{s.exs[e.id]={name:e.name,sets:Array.from({length:e.sets},()=>({w:'',reps:'',done:false})),skipped:false,reason:''};});
    ST.sessions[tKey]=s;
  }
  return s;
}
function lastResult(id){
  const dates=Object.keys(ST.sessions).filter(d=>d<todayISO()&&ST.sessions[d].done&&ST.sessions[d].exs&&ST.sessions[d].exs[id]).sort();
  if(!dates.length)return null;
  const e=ST.sessions[dates[dates.length-1]].exs[id];
  const parts=(e.sets||[]).filter(s=>s.done).map(s=>(s.w||'?')+'×'+(s.reps||'?'));
  return parts.length?parts.join(', '):null;
}
function viewTrain(){
  const dow=new Date().getDay(),tpl=getTemplate(dow),tKey=todayISO();
  if(!tpl){
    return '<div class="card"><h3>Сегодня силовой нет</h3><p>'+((dow===1||dow===4)?'Волейбольный день. Отметь тренировку на главной.':'День восстановления. Ближайшая силовая — см. главный экран.')+'</p></div>';
  }
  const s=curSession();scheduleSave();
  const tplArr=tpl.exs.map(e=>e.id).filter(id=>s.exs[id]);
  const order=s.order||tplArr;s.order=order;
  const allSets=order.reduce((n,id)=>n+(s.exs[id].sets||[]).length,0);
  const doneSets=order.reduce((n,id)=>n+(s.exs[id].sets||[]).filter(x=>x.done).length,0);
  let html='<div class="card"><div class="row between"><div><h3 style="margin:0">'+esc(s.name)+'</h3><p class="meta" style="margin:2px 0 0">неделя '+currentWeekNum()+' · '+doneSets+' / '+allSets+' подходов</p></div>'
   +(s.done?'<span class="chip green">Завершена ✓</span>':'')+'</div>'
   +'<div class="pline" style="margin-top:10px"><div style="width:'+(allSets?doneSets/allSets*100:0)+'%"></div></div></div>';
  order.forEach((id,idx)=>{
    const e=s.exs[id],info=exInfo(id);
    if(!e)return;
    const setsDone=(e.sets||[]).filter(x=>x.done).length;
    const all=setsDone>=e.sets.length&&!e.skipped;
    const prev=lastResult(id);
    html+='<div class="ex'+(all&&!e.skipped?' done':'')+(e.skipped?' skipped':'')+'" id="ex-'+id+'">'
     +'<div class="ex-head"><button class="iconbtn" onclick="moveEx(\''+id+'\',-1)" '+(idx===0?'disabled':'')+'>↑</button>'
     +'<span class="nm">'+esc(e.name)+'</span><span class="sch">'+setsDone+'/'+e.sets.length+'</span>'
     +'<button class="iconbtn" onclick="toggleExBody(\''+id+'\')">▾</button></div>'
     +'<div class="ex-body" style="display:none">'
     +(e.skipped?'<div class="err">Пропущено'+(e.reason?': '+esc(e.reason):'')+'</div>':'');
    if(!e.skipped){
      html+=(prev?'<div class="prev"><b>В прошлый раз:</b> '+prev+'</div>':'')
       +(info.tip?'<div class="tip"><b>Совет:</b> '+esc(info.tip)+'</div>':'')
       +(info.err?'<div class="err">'+esc(info.err)+'</div>':'');
      e.sets.forEach((st,i)=>{
        html+='<div class="srow"><span class="sn">'+(i+1)+'</span>'
         +'<input type="number" inputmode="decimal" placeholder="вес, кг" value="'+esc(st.w)+'" onchange="updSet(\''+id+'\','+i+',\'w\',this.value)">'
         +'<input type="number" inputmode="numeric" placeholder="повторы" value="'+esc(st.reps)+'" onchange="updSet(\''+id+'\','+i+',\'reps\',this.value)">'
         +'<button class="ck'+(st.done?' on':'')+'" onclick="toggleSetDone(\''+id+'\','+i+')">✓</button></div>';
      });
      html+='<div class="row" style="margin-top:6px;flex-wrap:wrap;gap:6px">'
       +'<button class="btn sm" onclick="addSet(\''+id+'\')">+ подход</button>'
       +'<button class="btn sm" onclick="copyPrev(\''+id+'\')">Повторить прошлый раз</button>'
       +'<button class="btn sm" onclick="skipEx(\''+id+'\')">Пропустить</button>'
       +'<button class="iconbtn red" onclick="delEx(\''+id+'\')" title="Удалить">🗑</button></div>'
       +(info.vid&&info.vid.length?info.vid.map(v=>'<a class="vid" href="'+v[0]+'" target="_blank">▶ '+esc(v[1])+'</a>').join(''):'')
    }else{
      html+='<div class="row" style="margin-top:8px"><button class="btn sm" onclick="unskipEx(\''+id+'\')">Вернуть упражнение</button></div>';
    }
    html+='</div></div>';
  });
  html+='<div class="card"><div class="row" style="flex-wrap:wrap;gap:8px">'
   +'<button class="btn grow" onclick="addExSheet()">+ Добавить упражнение</button>'
   +'<button class="btn '+(s.done?'':'green')+' grow" onclick="finishWorkout()">'+(s.done?'Тренировка завершена ✓ (нажми, чтобы открыть сводку)':'Завершить тренировку ✓')+'</button></div>'
   +'<div style="margin-top:12px"><textarea rows="2" placeholder="Комментарий к тренировке (самочувствие, техника, заметки)" onchange="updComment(this.value)">'+esc(s.comment||'')+'</textarea></div></div>';

function collectExSeries(id){
  const pts=[];
  Object.keys(ST.sessions).sort().forEach(d=>{
    const s=ST.sessions[d];if(!s.done||s.type!=='strength'||!s.exs||!s.exs[id])return;
    const sets=(s.exs[id].sets||[]).filter(x=>x.done&&+x.w>0);
    if(!sets.length)return;
    const avg=sets.reduce((a,x)=>a+ +x.w,0)/sets.length;
    pts.push({d,avg,max:Math.max(...sets.map(x=>+x.w)),reps:sets.reduce((a,x)=>a+(+x.reps||0),0)});
  });
  return pts;
}
function drawLine(cv,pts,fmt,color){
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr;cv.height=180*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const W=cv.clientWidth,H=180,P=28;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#2a2f3a';ctx.fillStyle='#6b7484';ctx.font='11px sans-serif';
  if(pts.length<2){ctx.fillText('Нужно минимум 2 тренировки с этим упражнением',P,H/2);return;}
  const ys=pts.map(p=>p.y);const min=Math.min(...ys),max=Math.max(...ys);
  const X=i=>P+(W-2*P)*i/(pts.length-1),Y=v=>H-P-(H-2*P)*((v-min)/((max-min)||1));
  for(let g=0;g<=4;g++){const v=min+(max-min)*g/4,y=Y(v);ctx.beginPath();ctx.moveTo(P,y);ctx.lineTo(W-P,y);ctx.stroke();ctx.fillText(Math.round(v*10)/10,2,y+4);}
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();
  pts.forEach((p,i)=>{i?ctx.lineTo(X(i),Y(p.y)):ctx.moveTo(X(0),Y(p.y));});
  ctx.stroke();
  ctx.fillStyle=color;pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(X(i),Y(p.y),3.5,0,7);ctx.fill();});
  ctx.fillStyle='#6b7484';
  ctx.fillText(fmtDate(pts[0].d),P,H-8);ctx.fillText(fmtDate(pts[pts.length-1].d),W-P-70,H-8);
}

  if(PROG_RANGE==='month'){const m=todayISO().slice(0,7);pts=pts.filter(p=>p.d.startsWith(m));}
  drawLine(cv,pts.map(p=>({d:p.d,y:p.avg})),'',getComputedStyle(document.documentElement).getPropertyValue('--blue'));
  const cap=$('ch1cap');
  if(cap)cap.textContent=pts.length?('Средний рабочий вес: '+pts.map(p=>Math.round(p.avg*10)/10).join(' → ')):'Нет данных за период';
}

/* ================= FOOD ================= */
function viewFood(){
  const s=ST.settings,tKey=todayISO();
  const f=ST.food[tKey]||{entries:[]};
  const sum=k=>f.entries.reduce((a,e)=>a+ +e[k]||0,0);
  const kcal=sum('kcal'),p=sum('p'),fat=sum('f'),c=sum('c');
  const w=ST.water[tKey]||0;
  const bar=(name,val,tgt,unit,color)=>{
    const pct=Math.min(100,Math.round(val/tgt*100));
    return '<div style="margin-top:10px"><div class="row between"><span style="font-size:14px">'+name+'</span><span class="meta num">'+Math.round(val)+' / '+tgt+' '+unit+'</span></div><div class="pline"><div style="width:'+pct+'%;background:'+color+'"></div></div></div>';};
  return '<div class="card"><h3>Нормы дня</h3>'
   +bar('Калории',kcal,s.calTarget,'ккал','var(--blue)')
   +bar('Белки',p,s.pTarget,'г','var(--green)')
   +bar('Жиры',fat,s.fTarget,'г','var(--yellow)')
   +bar('Углеводы',c,s.cTarget,'г','var(--red)')+'</div>'
   +'<div class="card"><div class="row between"><h3 style="margin:0">Вода 💧</h3><b class="num">'+w+' / '+s.waterTarget+' мл</b></div>'
   +'<div class="pline"><div style="width:'+Math.min(100,w/s.waterTarget*100)+'%"></div></div>'
   +'<div class="water-btns"><button onclick="addWater(250)">+250</button><button onclick="addWater(500)">+500</button><button onclick="resetWater()">Сброс</button></div></div>'
   +'<div class="card"><h3>Дневник · '+fmtDate(tKey)+'</h3>'
   +(f.entries.length?f.entries.map((e,i)=>'<div class="fitem"><span>'+esc(e.name)+'<br><span class="meta">'+e.kcal+' ккал · Б'+e.p+' Ж'+e.f+' У'+e.c+'</span></span><button class="iconbtn red" onclick="delFood('+i+')">🗑</button></div>').join(''):'<p class="meta">Пока пусто. Ведение питания — опция, не обязанность.</p>')
   +'<button class="btn blue block" style="margin-top:12px" onclick="addFoodSheet()">+ Добавить продукт</button></div>'
   +'<div class="card"><h3>Шпаргалка</h3><p>• Каждый приём = белок + углеводы.</p><p>• За 1.5–2 ч до тренировки — еда с углеводами, после — белок + углеводы.</p><p>• Курица, яйца, творог 5–9%, рыба — база белка.</p></div>';
}
function addWater(n){const t=todayISO();ST.water[t]=(ST.water[t]||0)+n;scheduleSave();render();}
function resetWater(){ST.water[todayISO()]=0;scheduleSave();render();}
const FOOD_DB={
 'Курица грудка 100 г':[110,23,2,0],'Гречка отварная 100 г':[110,4,1,20],'Рис отварной 100 г':[120,2,0,26],
 'Овсянка 100 г (сухая)':[350,12,7,60],'Яйцо 1 шт':[80,7,6,0],'Творог 5% 100 г':[120,17,5,2],
 'Говядина 100 г':[190,26,8,0],'Молоко 2.5% 300 мл':[150,9,7,14],'Банан 1 шт':[90,1,0,23],
 'Хлеб ржаной 1 ломтик':[70,2,0,14],'Картофель отварной 100 г':[80,2,0,17],'Лосось 100 г':[200,20,13,0],
 'Арахис 30 г':[170,7,15,5],'Яблоко 1 шт':[80,0,0,18],'Творог 9% 100 г':[160,18,9,3]
};
function addFoodSheet(){
  openSheet('<h3 style="margin-bottom:6px">Быстрый выбор</h3>'
   +Object.keys(FOOD_DB).map(k=>{const v=FOOD_DB[k];return '<button class="sheet-item" onclick="addFoodDB(\''+k+'\')"><span class="grow">'+k+'</span><span class="meta">'+v[0]+' ккал</span></button>';}).join('')
   +'<button class="sheet-item" style="color:var(--blue2)" onclick="closeSheet();addFoodManual()">＋ Свой продукт вручную</button>');
}
function addFoodDB(k){
  const t=todayISO();ST.food[t]=ST.food[t]||{entries:[]};
  const v=FOOD_DB[k];ST.food[t].entries.push({name:k,kcal:v[0],p:v[1],f:v[2],c:v[3]});
  closeSheet();scheduleSave();render();toast('Добавлено');
}
function addFoodManual(){
  const name=prompt('Название:','');if(!name)return;
  const kcal=+prompt('Калории:','0')||0,p=+prompt('Белки, г:','0')||0,f=+prompt('Жиры, г:','0')||0,c=+prompt('Углеводы, г:','0')||0;
  const t=todayISO();ST.food[t]=ST.food[t]||{entries:[]};
  ST.food[t].entries.push({name,kcal,p,f,c});scheduleSave();render();toast('Добавлено');
}
function delFood(i){const t=todayISO();ST.food[t].entries.splice(i,1);scheduleSave();render();}
/* ================= WELLNESS ================= */
function viewWell(){
  const t=todayISO(),w=ST.wellness[t]||{};
  const sl=(key,lbl,val)=>{v=w[key]||5;return '<div class="slider-row"><div class="lbl"><span>'+lbl+'</span><span class="val" id="v_'+key+'">'+v+'/10</span></div><input type="range" min="1" max="10" value="'+v+'" oninput="$(\'v_'+key+'\').textContent=this.value+\'/10\'" onchange="updWell(\''+key+'\',this.value)"></div>';};
  return '<div class="card"><h3>Как ты сегодня? · '+fmtDate(t)+'</h3><p class="meta">Шкала 1–10. Это дневник самочувствия, а не медицинский инструмент.</p>'
   +'<div class="row" style="margin-top:10px"><input id="wsleep" type="number" inputmode="decimal" placeholder="Сон, часов ('+(w.sleep||'—')+')" style="flex:1"><span class="meta">часов сна</span></div>'
   +sl('sleepQ','Качество сна')+sl('energy','Энергия')+sl('fatigue','Усталость (10 = выжат)')+sl('soreness','Мышечная болезненность')+sl('mood','Общее самочувствие')+sl('motivation','Желание тренироваться')
   +'<textarea rows="2" placeholder="Комментарий (стресс, погода, что-то болит...)" onchange="updWell(\'note\',this.value)">'+esc(w.note||'')+'</textarea></div>'
   +'<div class="card"><h3>Связь восстановления и тренировок</h3>'+wellAnalytics()+'</div>';
}
function updWell(k,v){const t=todayISO();ST.wellness[t]=ST.wellness[t]||{};ST.wellness[t][k]=v;
  if(k==='note'){ST.wellness[t][k]=v;}
  if(k==='sleep'){ST.wellness[t].sleep=parseFloat(v)||0;}
  scheduleSave();}
function wellAnalytics(){
  const days=Object.keys(ST.wellness).sort();
  if(days.length<3)return '<p class="meta">Нужно минимум 3 записи для аналитики.</p>';
  const tKey=todayISO();
  const trDays=days.filter(d=>ST.sessions[d]&&ST.sessions[d].done&&ST.wellness[d].energy);
  const restDays=days.filter(d=>!(ST.sessions[d]&&ST.sessions[d].done)&&d!==tKey&&ST.wellness[d].energy);
  const avg=(arr,k)=>arr.length?Math.round(arr.reduce((a,d)=>a+ +ST.wellness[d][k],0)/arr.length*10)/10:'—';
  let html='<div class="kv"><span>Энергия в дни тренировок</span><b>'+avg(trDays,'energy')+'</b></div>'
   +'<div class="kv"><span>Энергия в дни отдыха</span><b>'+avg(restDays,'energy')+'</b></div>'
   +'<div class="kv"><span>Средний сон</span><b>'+avg(days,'sleep')+' ч</b></div>';
  const lowS=days.filter(d=>+ST.wellness[d].sleep<7&&ST.wellness[d].energy);
  if(lowS.length)html+='<div class="tip" style="margin-top:10px"><b>Заметка:</b> в дни, когда сон был меньше 7 часов, энергия в среднем '+Math.round(lowS.reduce((a,d)=>a+ +ST.wellness[d].energy,0)/lowS.length*10)/10+'/10. Сон — главный «анаболик».</div>';
  return html;
}
/* ================= SETTINGS ================= */
function viewSettings(){
  const s=ST.settings;
  const daysRow=(key,cur)=>[1,2,3,4,5,6,0].map(d=>'<button class="'+(cur.includes(d)?'sel':'')+'" data-d="'+d+'" onclick="toggleDay(\''+key+'\','+d+')" style="flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--border);font-size:13px;'+(cur.includes(d)?'background:var(--text);color:#111;font-weight:600':'color:var(--text2)')+'">'+RU_D[d]+'</button>').join('');
  const num=(k,lbl,unit)=>{const v=s[k];return '<div class="kv"><span>'+lbl+'</span><span class="row" style="gap:6px"><input type="number" inputmode="decimal" value="'+v+'" style="width:90px;padding:6px 10px" onchange="updSett(\''+k+'\',this.value)"><span class="meta">'+unit+'</span></span></div>';};
  return '<div class="card"><h3>Профиль</h3>'
   +'<div class="kv"><span>Имя</span><input style="width:150px;padding:6px 10px" value="'+esc(s.name)+'" onchange="updSett(\'name\',this.value)"></div>'
   +num('height','Рост','см')+num('weight','Текущий вес','кг')+num('targetWeight','Целевой вес','кг')+'</div>'
   +'<div class="card"><h3>Расписание</h3><p class="meta" style="margin-bottom:6px">Силовые дни:</p><div class="row" style="gap:5px">'+daysRow('strengthDays',ST.schedStrength||[2,5,6])+'</div>'
   +'<p class="meta" style="margin:12px 0 6px">Дни волейбола:</p><div class="row" style="gap:5px">'+daysRow('vbDays',ST.schedVB||[1,4])+'</div>'
   +'<p class="meta" style="margin-top:8px">Расписание влияет на «тренировку сегодня» и отметку пропущенных.</p></div>'
   +'<div class="card"><h3>Цели питания</h3>'+num('calTarget','Калории','ккал')+num('pTarget','Белок','г')+num('fTarget','Жиры','г')+num('cTarget','Углеводы','г')+num('waterTarget','Вода','мл')+'</div>'
   +'<div class="card"><h3>Тренировка</h3>'
   +num('restSec','Отдых между подходами (пресет «ещё»)','сек')
   +'<div class="kv"><span>Автозапуск таймера после подхода</span><span class="switch'+(s.autoTimer?' on':'')+'" onclick="updSett(\'autoTimer\',!'+s.autoTimer+');render()"></span></div>'
   +'<div class="kv"><span>Старт блока (для счётчика недель)</span><input type="date" style="width:150px;padding:6px 10px" value="'+s.weekStart+'" onchange="updSett(\'weekStart\',this.value)"></div></div>';
}
ST.schedStrength=ST.schedStrength||[2,5,6];ST.schedVB=ST.schedVB||[1,4];
function updSett(k,v){ST.settings[k]=(k==='name'||k==='weekStart')?v:(parseFloat(v)||0);scheduleSave();if(k==='weight'){ST.body[todayISO()]=Object.assign({},ST.body[todayISO()],{weight:parseFloat(v)});scheduleSave();}toast('Сохранено');}
function toggleDay(arr,d){const a=ST[arr];const i=a.indexOf(d);i>=0?a.splice(i,1):a.push(d);scheduleSave();render();}
/* ================= DATA ================= */
function viewData(){
  const kb=Math.round((JSON.stringify(ST).length+PHOTOS.reduce((a,p)=>a+(p.blob||p.url||'').length,0))/1024);
  return '<div class="card"><h3>Хранилище</h3><div class="kv"><span>Размер данных</span><b>≈ '+kb+' КБ</b></div><div class="kv"><span>Тренировок</span><b>'+Object.keys(ST.sessions).length+'</b></div><div class="kv"><span>Фото</span><b>'+PHOTOS.length+'</b></div><div class="kv"><span>Механизм</span><b>IndexedDB (на устройстве)</b></div></div>'
   +'<div class="card"><h3>Резервная копия</h3><p class="meta" style="margin-bottom:10px">Экспорт скачает JSON со всеми данными, включая фото. Храни его в облаке.</p>'
   +'<div class="row"><button class="btn blue grow" onclick="exportData()">⬇ Экспорт JSON</button><label class="btn grow" style="text-align:center">⬆ Импорт<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div></div>'
   +'<div class="card"><h3 style="color:var(--red)">Опасная зона</h3><button class="btn red block" onclick="wipeAll()">Удалить ВСЕ данные</button></div>';
}
async function exportData(){
  try{
    const data={version:2,exportedAt:new Date().toISOString(),state:ST,photos:PHOTOS.map(p=>({view:p.view,date:p.date,blob:p.blob||p.url}))};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fitness-backup-'+todayISO()+'.json';a.click();
    toast('Копия скачана');
  }catch(e){toast('Ошибка экспорта');}
}
async function importData(inp){
  const f=inp.files[0];if(!f)return;
  if(!confirm('Импорт заменит текущие данные. Продолжить?'))return;
  try{
    const data=JSON.parse(await f.text());
    if(data.state)ST=Object.assign(JSON.parse(JSON.stringify(DEF)),data.state);
    ensureTemplates();
    await DB.set('kv','state',ST);
    if(data.photos){for(const p of data.photos){const rec={...p,_id:Date.now()+Math.random()};await DB.set('photos',rec._id,rec);}}
    toast('Импорт завершён');setTimeout(()=>location.reload(),800);
  }catch(e){toast('Файл повреждён');}
}
async function wipeAll(){
  if(!confirm('Точно удалить ВСЕ данные? Это необратимо.'))return;
  if(!confirm('Включая историю, фото и настройки?'))return;
  try{localStorage.removeItem('fp1');
    const keys=await DB.all('photos');for(const p of keys)await DB.del('photos',p._id);
    ST=JSON.parse(JSON.stringify(DEF));ensureTemplates();
    await DB.set('kv','state',ST);toast('Данные удалены');setTimeout(()=>location.reload(),800);
  }catch(e){toast('Ошибка');}
}
/* ================= TIMER ================= */
let tTotal=90,tLeft=90,tInt=null,tEnd=null;
const tDisp=$('tDisp');
function fmtT(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function renderT(){tDisp.textContent=fmtT(Math.max(0,tLeft));tDisp.classList.toggle('hot',tLeft<=10&&tInt);}
$('tPresets').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tPresets button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');tTotal=+b.dataset.s;tLeft=tTotal;stopT();renderT();
});
document.querySelector('#tPresets').insertAdjacentHTML('beforeend','<button data-s="custom" onclick="customTime()">...</button>');
function customTime(){const v=+prompt('Секунды отдыха:','90');if(!v)return;tTotal=Math.min(600,Math.max(10,v));tLeft=tTotal;
 document.querySelectorAll('#tPresets button').forEach(x=>x.classList.remove('sel'));event.target.classList.add('sel');stopT();renderT();}
function timerStart(){
  if(tInt)return;
  tEnd=Date.now()+tLeft*1000;
  $('tStart').textContent='Пауза';
  tInt=setInterval(()=>{
    tLeft=Math.round((tEnd-Date.now())/1000);
    if(tLeft<=0){stopT();tLeft=tTotal;renderT();beep();$('tStart').textContent='Старт';toast('Отдых окончен!');return;}
    renderT();
  },250);
  renderT();
}
function stopT(){clearInterval(tInt);tInt=null;$('tStart').textContent='Старт';tDisp.classList.remove('hot');}
function timerToggle(){tInt?stopT():timerStart();}
function timerReset(){stopT();tLeft=tTotal;renderT();}
$('tStart').onclick=timerToggle;$('tReset').onclick=timerReset;
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();
  [0,0.22,0.44].forEach((d,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
  o.frequency.value=i===2?1320:880;g.gain.setValueAtTime(0.001,ctx.currentTime+d);
  g.gain.exponentialRampToValueAtTime(0.35,ctx.currentTime+d+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d+0.18);
  o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+0.22);});}catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,100,200]);}
/* ================= INIT ================= */
(async function(){
  try{await DB.open();}catch(e){document.body.insertAdjacentHTML('afterbegin','<div style="padding:10px;background:#ff6b6b22;color:var(--red);text-align:center">Хранилище недоступно — данные не сохранятся</div>');}
  await loadState();ensureTemplates();
  tTotal=tLeft=ST.settings.restSec||90;
  render();renderT();
  if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
    try{navigator.serviceWorker.register('sw.js');}catch(e){}
  }
})();
</script>
